<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Employee {}
      class Manager extends Employee {}

      const farhan = new Employee();
      const maira = new Manager();

      console.info(typeof farhan);
      console.info(typeof maira);

      console.info(farhan instanceof Employee);
      console.info(maira instanceof Manager);

      console.info(farhan instanceof Manager);
      console.info(maira instanceof Employee);
    </script>
  </body>
</html>
