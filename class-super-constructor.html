<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Employee {
        constructor(firstName) {
          this.firstName = firstName;
        }
        sayHello(name) {
          console.info(`Hi ${name}, my name is employee ${this.firstName}`);
        }
      }
      class Manager extends Employee {
        constructor(firstName, lastName) {
          super(firstName);
          this.lastName = lastName;
        }
        sayHello(name) {
          console.info(
            `Hi ${name}, my name is manager ${this.firstName} ${this.lastName}`,
          );
        }
      }

      const farhan = new Employee("farhan");
      farhan.sayHello("aidah");

      console.info(farhan);
      const maira = new Manager("maira", "sire");
      maira.sayHello("farhan");
      console.info(maira);
    </script>
  </body>
</html>
